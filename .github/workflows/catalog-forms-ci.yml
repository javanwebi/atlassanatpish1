name: Catalog forms CI
on:
  pull_request:
    paths:
      - 'src/admin/modules/**'
      - '.github/workflows/catalog-forms-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Check portal integration
        run: npm run test:portal
